:root{--v40o:#F26A1B;--v40g:#3C4A2E;--v40g2:#2C3722;--v40c:#EDE3D2;--v40d:#241F19}

/* --- fix 1: flying image must not cover the work heading on phone --- */
@media (max-width:860px){
  #work h2,#work .sub{position:relative;z-index:14}
  #fxfly{z-index:8}
}

/* --- fix 2: work cards always reveal (replaces the rootfix hack) --- */
@media (min-width:861px){
  #work .cdg .cdc{opacity:1!important;clip-path:none!important;transform:none!important}
}
#work .cdg .cdc-c{opacity:1!important;transform:none!important}

/* --- A: product reel (Two26-style continuous stage) --- */
.v40reel{position:relative;overflow:hidden;background:var(--v40g2);color:var(--v40c);padding:34px 0 40px}
.v40reel .rlab{display:flex;align-items:center;gap:10px;justify-content:center;font:700 .72rem 'Alexandria',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C9BFA8;margin:0 0 18px}
.v40reel .rlab b{color:var(--v40o)}
.v40row{display:flex;gap:14px;width:max-content;will-change:transform}
.v40row.r1{animation:v40x 34s linear infinite}
.v40row.r2{animation:v40x 46s linear infinite reverse;margin-top:14px}
.v40row img{width:210px;height:280px;object-fit:cover;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.35);flex:0 0 auto}
.v40row .pill40{flex:0 0 auto;align-self:center;background:var(--v40c);color:#2B241E;border-radius:999px;padding:10px 18px;font:700 .82rem 'Alexandria',sans-serif;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.v40row .pill40.o{background:var(--v40o);color:#fff}
@keyframes v40x{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
@media (max-width:860px){
  .v40row img{width:150px;height:200px;border-radius:14px}
  .v40row .pill40{padding:8px 14px;font-size:.72rem}
  .v40reel{padding:26px 0 30px}
}

/* --- B: scroll dial replacing the switched-off wheel --- */
.v40dial{background:var(--v40g);color:var(--v40c);padding:56px 20px 64px;text-align:center;position:relative;overflow:hidden}
.v40dial .dkick{font:700 .7rem 'Alexandria',sans-serif;letter-spacing:.2em;color:#C9BFA8;text-transform:uppercase}
.v40dial h3{margin:8px 0 26px;font:800 clamp(1.5rem,6vw,2.4rem) 'Changa','Alexandria',sans-serif;color:var(--v40c)}
.v40dial .dwrap{position:relative;width:min(78vw,330px);aspect-ratio:1;margin:0 auto}
.v40dial svg{width:100%;height:100%;display:block}
.v40dial .dtrack{fill:none;stroke:rgba(237,227,210,.18);stroke-width:2}
.v40dial .dprog{fill:none;stroke:var(--v40o);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.v40dial .dtick{stroke:rgba(237,227,210,.35);stroke-width:2}
.v40dial .dtick.on{stroke:var(--v40o);stroke-width:4}
.v40dial .dcore{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(242,106,27,.16),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.v40dial .dcat{font:800 clamp(1.05rem,4.6vw,1.5rem) 'Changa','Alexandria',sans-serif;color:var(--v40c)}
.v40dial .dnum{font:700 .78rem 'Alexandria',sans-serif;color:var(--v40o);letter-spacing:.08em}
.v40dial .dlabels{position:absolute;inset:0;pointer-events:none}
